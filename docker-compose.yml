version: '3.8'

services:
  comic-drama-app:
    build: .
    container_name: comic-drama-app
    ports:
      - "5000:5000"
    volumes:
      - ./output:/app/output
      - ./novels:/app/novels
      - ./app/config:/app/app/config
    environment:
      - FLASK_ENV=production
      - COMFYUI_URL=http://host.docker.internal:8188
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
